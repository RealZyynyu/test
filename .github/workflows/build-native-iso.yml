name: NOVA Final ISO (manual only)
on:
  workflow_dispatch:
    inputs:
      final_release:
        description: 'Final version approved; build and publish NOVA ISO'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    if: ${{ inputs.final_release == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out NOVA source
        uses: actions/checkout@v4
      - name: Install boot-image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm xorriso git curl gcc make nasm python3-pil fonts-inter
      - name: Generate smooth proportional font atlas
        run: |
          python3 tools/generate_font.py
          test -s kernel/raster_font.h
      - name: Prepare freestanding kernel template
        run: |
          git clone --depth=1 https://github.com/Limine-Bootloader/limine-c-template-x86-64.git _builder
          cp kernel/main.c _builder/kernel/src/main.c
          cp kernel/font.h _builder/kernel/src/font.h
          cp kernel/raster_font.h _builder/kernel/src/raster_font.h
          cp kernel/ps2_mouse.h _builder/kernel/src/ps2_mouse.h
          cp kernel/ramfs.h _builder/kernel/src/ramfs.h
          cp kernel/pmm.h _builder/kernel/src/pmm.h
          cp kernel/scheduler.h _builder/kernel/src/scheduler.h
          cp kernel/pci.h _builder/kernel/src/pci.h
          cp kernel/interrupts.h _builder/kernel/src/interrupts.h
          cp kernel/irq.S _builder/kernel/src/irq.S
          cp kernel/rtc.h _builder/kernel/src/rtc.h
          cp kernel/cpu.h _builder/kernel/src/cpu.h
          cp kernel/ata.h _builder/kernel/src/ata.h
          cp kernel/fat16.h _builder/kernel/src/fat16.h
          cp kernel/vfs.h _builder/kernel/src/vfs.h
          cp limine.conf _builder/limine.conf
      - name: Build independent x86-64 kernel and ISO
        run: |
          make -C _builder TOOLCHAIN=llvm all
          test -s _builder/template.iso
          mv _builder/template.iso nova-os-native-x86_64.iso
          sha256sum nova-os-native-x86_64.iso > nova-os-native-x86_64.iso.sha256
      - name: VM boot screenshot (optional)
        continue-on-error: true
        run: |
          sudo apt-get install -y qemu-system-x86 python3-pil
          qemu-system-x86_64 -m 512 -vga std -cdrom nova-os-native-x86_64.iso \
            -boot d -display none -monitor unix:/tmp/nova-qemu.sock,server,nowait \
            -no-reboot &
          emulator_pid=$!
          sleep 12
          python3 - <<'PY'
          import os, socket, time
          sock=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM)
          sock.connect("/tmp/nova-qemu.sock")
          sock.settimeout(2)
          try:
              sock.recv(2048)
          except socket.timeout:
              pass
          sock.sendall(b"screendump /tmp/nova-os-preview.ppm\n")
          for i in range(24):
              if os.path.exists("/tmp/nova-os-preview.ppm") and os.path.getsize("/tmp/nova-os-preview.ppm")>1000:
                  break
              time.sleep(.3)
          else:
              raise RuntimeError("QEMU did not produce a preview")
          from PIL import Image
          img=Image.open("/tmp/nova-os-preview.ppm")
          img.save("nova-os-native-preview.png")
          print("Saved screenshot:",img.size)
          sock.sendall(b"quit\n")
          PY
          kill "$emulator_pid" 2>/dev/null || true
      - name: QEMU serial boot smoke test
        run: |
          # Require actual kernel entry and RAM filesystem initialization.
          truncate -s 8M nova-test-disk.img
          timeout 18s qemu-system-x86_64 -m 512 -vga std -cdrom nova-os-native-x86_64.iso \
            -drive file=nova-test-disk.img,format=raw,if=ide,index=0,media=disk \
            -boot d -display none -monitor none -serial file:nova-os-serial.log \
            -d int,guest_errors -D nova-qemu-debug.log -no-reboot || test "$?" -eq 124
          echo "=== NOVA serial boot output ==="
          cat nova-os-serial.log || true
          echo "=== QEMU trace tail ==="
          tail -35 nova-qemu-debug.log || true
          test -s nova-os-serial.log
          grep -q NOVA_KERNEL_BOOT_OK nova-os-serial.log
          grep -q NOVA_RAMFS_READY nova-os-serial.log
          grep -q NOVA_PMM_READY nova-os-serial.log
          grep -q NOVA_PMM_SELFTEST_OK nova-os-serial.log
          grep -q NOVA_SCHED_SELFTEST_OK nova-os-serial.log
          grep -q NOVA_PCI_INVENTORY_READY nova-os-serial.log
          grep -q NOVA_IDT_PIT_READY nova-os-serial.log
          grep -q NOVA_IRQ_HANDLER_CALLED nova-os-serial.log
          grep -q NOVA_IRQ_SW_TEST_OK nova-os-serial.log
          grep -q NOVA_IF_ENABLED nova-os-serial.log
          grep -q NOVA_PIC_MASK_OK nova-os-serial.log
          grep -q NOVA_CPU_READY nova-os-serial.log
          grep -q NOVA_RTC_READY nova-os-serial.log
          grep -q NOVA_RAMFS_SELFTEST_OK nova-os-serial.log
          grep -q NOVA_ATA_PRIMARY_DETECTED nova-os-serial.log
          grep -q NOVA_ATA_READ0_OK nova-os-serial.log
          cat nova-os-serial.log
      - name: Publish ISO as a private GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="nova-native-final-${GITHUB_SHA:0:8}"
          files=(nova-os-native-x86_64.iso nova-os-native-x86_64.iso.sha256)
          if [[ -s nova-os-native-preview.png ]]; then
            files+=(nova-os-native-preview.png)
          fi
          if [[ -s nova-os-serial.log ]]; then
            files+=(nova-os-serial.log)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "NOVA OS Native (Final ISO)" \
              --notes "Independent NOVA kernel with safe read-only legacy IDE ATA probing and sector reads, CPU/RTC and RAM files; QEMU tests use an 8 MiB disposable virtual disk. Release must be verified before installing on real hardware. Test in VirtualBox only; do not install on a real machine." \
              --prerelease
          fi
