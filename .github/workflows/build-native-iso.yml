name: Build NOVA Native ISO
on:
  push:
    branches: [nova-os-native]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out NOVA source
        uses: actions/checkout@v4
      - name: Install boot-image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm xorriso git curl gcc make nasm
      - name: Prepare freestanding kernel template
        run: |
          git clone --depth=1 https://github.com/Limine-Bootloader/limine-c-template-x86-64.git _builder
          cp kernel/main.c _builder/kernel/src/main.c
          cp kernel/font.h _builder/kernel/src/font.h
          cp limine.conf _builder/limine.conf
      - name: Build independent x86-64 kernel and ISO
        run: |
          make -C _builder TOOLCHAIN=llvm all
          test -s _builder/template.iso
          mv _builder/template.iso nova-os-native-x86_64.iso
          sha256sum nova-os-native-x86_64.iso > nova-os-native-x86_64.iso.sha256
      - name: Publish ISO as a private GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="nova-native-v0.1"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" nova-os-native-x86_64.iso nova-os-native-x86_64.iso.sha256 --clobber
          else
            gh release create "$tag" nova-os-native-x86_64.iso nova-os-native-x86_64.iso.sha256 \
              --target "$GITHUB_SHA" \
              --title "NOVA OS Native 0.1 (Experimental)" \
              --notes "Independent x86-64 kernel developer preview. NOT a Windows replacement. Test in VirtualBox only; do not install on a real machine." \
              --prerelease
          fi
